<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Music Quiz">
<title>Mick Hegarty Piano Tuition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎹</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --border: rgba(0,0,0,0.10);
    --border-strong: rgba(0,0,0,0.18);
    --text: #1A1814;
    --text-muted: #6B6760;
    --text-faint: #A09D99;
    --accent: #2A5C45;
    --accent-light: #EAF3EE;
    --danger: #8B2E2E;
    --danger-light: #FAEAEA;
    --gold: #8B6914;
    --gold-light: #FDF4DC;
    --radius: 10px;
    --radius-lg: 16px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    max-width: 600px;
    padding: 1.5rem 1.5rem 0.75rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  #logo {
    position: relative;
    width: 100%;
    padding: 0.6rem 0 0.6rem 3rem;
    overflow: hidden;
  }

  #logo-clef {
    position: absolute;
    left: -2px;
    top: 50%;
    transform: translateY(-52%);
    font-family: Georgia, serif;
    font-size: 62px;
    line-height: 1;
    color: var(--gold);
    opacity: 0.28;
    pointer-events: none;
    user-select: none;
  }

  .logo-staff-line {
    position: absolute;
    left: 0; right: 0;
    height: 0.5px;
    background: var(--border);
    pointer-events: none;
  }

  #logo-name {
    font-family: 'Lora', Georgia, serif;
    font-size: 21px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: 0.5px;
    position: relative;
    z-index: 1;
    line-height: 1.25;
  }

  #logo-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: 9px;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 4px;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
    margin-top: 4px;
  }

  #logo-rule {
    width: calc(100% - 3rem);
    margin-left: 3rem;
    border: none;
    border-top: 0.5px solid var(--border-strong);
    margin-top: 1px;
  }
  #logo-rule2 {
    width: calc(100% - 3rem);
    margin-left: 3rem;
    border: none;
    border-top: 0.5px solid var(--border-strong);
    margin-top: 2px;
    opacity: 0.4;
  }

  #mode-label-wrap {
    font-size: 12px;
    color: var(--text-faint);
    font-weight: 300;
    margin-top: 0.35rem;
    letter-spacing: 0.2px;
  }

  /* Mode selector */
  #mode-bar {
    width: 100%;
    max-width: 600px;
    padding: 0 1.5rem 1.25rem;
    display: flex;
    gap: 8px;
  }

  .mode-btn {
    flex: 1;
    padding: 9px 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    line-height: 1.3;
  }

  .mode-btn.active {
    background: var(--text);
    border-color: var(--text);
    color: #fff;
  }

  .mode-btn:hover:not(.active) {
    background: var(--surface2);
  }

  /* Main card */
  #main {
    width: 100%;
    max-width: 600px;
    padding: 0 1.5rem;
    flex: 1;
  }

  #question-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem 1.5rem 1.75rem;
    margin-bottom: 1rem;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  #clef-label {
    font-size: 12px;
    color: var(--text-faint);
    font-weight: 400;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    min-height: 16px;
  }

  #display-area {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #chord-symbol {
    font-family: 'Lora', serif;
    font-size: 58px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -1px;
    text-align: center;
  }

  /* Staff SVG styles */
  .staff-svg { display: block; }

  /* Answer input for note/key modes */
  #answer-row {
    display: flex;
    gap: 8px;
    width: 100%;
    margin-top: 0.5rem;
  }

  #answer-input {
    flex: 1;
    padding: 12px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  #answer-input:focus { border-color: var(--text); }
  #answer-input::placeholder { color: var(--text-faint); }

  #submit-btn {
    padding: 12px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--text);
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  #submit-btn:hover { opacity: 0.85; }

  /* Options grid (chord mode) */
  #options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 1rem;
  }

  .opt-btn {
    background: var(--surface);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 14px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    text-align: center;
    line-height: 1.4;
  }

  .opt-btn:hover:not(:disabled) { background: var(--surface2); border-color: var(--border-strong); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .opt-btn.wrong { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }
  .opt-btn.reveal { background: var(--accent-light); border-color: var(--accent); color: var(--accent); opacity: 0.55; }

  /* Feedback */
  #feedback {
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    min-height: 20px;
    margin-bottom: 0.85rem;
    color: var(--text);
  }

  #feedback.correct-fb { color: var(--accent); }
  #feedback.wrong-fb { color: var(--danger); }
  #feedback.hint { color: var(--text-muted); font-weight: 400; font-size: 13px; }

  #sub-feedback {
    text-align: center;
    font-size: 12px;
    color: var(--text-faint);
    min-height: 16px;
    margin-bottom: 0.85rem;
    font-style: italic;
  }

  /* Next button */
  #next-btn {
    display: block;
    width: 100%;
    padding: 13px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 400;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s;
    margin-bottom: 1.5rem;
  }

  #next-btn:hover { background: var(--surface2); }
  #next-btn:disabled { opacity: 0.3; cursor: default; }

  /* Score bar */
  #score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 1rem;
    padding: 0 0.25rem;
  }

  #score-bar .val { font-weight: 500; color: var(--text-muted); }

  .streak-fire { color: var(--gold); }

  /* Note entry helper buttons */
  #note-helpers {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 0.5rem;
  }

  .helper-btn {
    padding: 6px 12px;
    font-size: 13px;
    border: 0.5px solid var(--border-strong);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }

  .helper-btn:hover { background: var(--surface2); }

  /* Responsive */
  @media (max-width: 480px) {
    header { padding: 1.25rem 1rem 0.75rem; }
    #mode-bar { padding: 0 1rem 1rem; }
    #main { padding: 0 1rem; }
    #chord-symbol { font-size: 46px; }
    .mode-btn { font-size: 11px; padding: 8px 4px; }
  }
</style>
</head>
<body>

<header>
  <div id="logo">
    <div class="logo-staff-line" style="top:22%"></div>
    <div class="logo-staff-line" style="top:36%"></div>
    <div class="logo-staff-line" style="top:50%"></div>
    <div class="logo-staff-line" style="top:64%"></div>
    <div class="logo-staff-line" style="top:78%"></div>
    <div id="logo-clef">𝄞</div>
    <div id="logo-name">Mick Hegarty</div>
    <div id="logo-sub">Piano &nbsp; Tuition</div>
  </div>
  <hr id="logo-rule">
  <hr id="logo-rule2">
  <div id="mode-label-wrap"><span id="mode-label">Chord Symbols</span></div>
</header>

<div id="mode-bar">
  <button class="mode-btn active" onclick="setMode('chords')">Chord<br>Symbols</button>
  <button class="mode-btn" onclick="setMode('notes')">Note<br>Reading</button>
  <button class="mode-btn" onclick="setMode('keys')">Key<br>Signatures</button>
</div>

<div id="main">
  <div id="score-bar">
    <div>Score: <span class="val" id="score-val">0 / 0</span></div>
    <div>Streak: <span class="val" id="streak-val">0</span></div>
  </div>

  <div id="question-card">
    <div id="clef-label"></div>
    <div id="display-area" style="width:100%;display:flex;justify-content:center;align-items:center;"></div>
    <div id="answer-row" style="display:none">
      <input type="text" id="answer-input" placeholder="e.g. F# or Bb major" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="submit-btn" onclick="submitFreeAnswer()">Check</button>
    </div>
    <div id="note-helpers" style="display:none">
      <button class="helper-btn" onclick="insertChar('♭')">♭</button>
      <button class="helper-btn" onclick="insertChar('♯')">♯</button>
    </div>
  </div>

  <div id="options"></div>
  <div id="feedback"></div>
  <div id="sub-feedback"></div>
  <button id="next-btn" disabled onclick="nextQuestion()">Next →</button>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────

const CHORD_DATA = [
  { symbol:"Cmaj7",  type:"Major 7",      alt:["CΔ7","CΔ","CM7"] },
  { symbol:"CΔ7",    type:"Major 7",      alt:["Cmaj7","CΔ","CM7"] },
  { symbol:"CΔ",     type:"Major 7",      alt:["Cmaj7","CΔ7","CM7"] },
  { symbol:"CM7",    type:"Major 7",      alt:["Cmaj7","CΔ7","CΔ"] },
  { symbol:"Fmaj7",  type:"Major 7",      alt:["FΔ7","FΔ"] },
  { symbol:"FΔ",     type:"Major 7",      alt:["Fmaj7","FΔ7"] },
  { symbol:"AbΔ7",   type:"Major 7",      alt:["Abmaj7"] },
  { symbol:"BbΔ",    type:"Major 7",      alt:["Bbmaj7","BbΔ7"] },
  { symbol:"C7",     type:"Dominant 7",   alt:[] },
  { symbol:"G7",     type:"Dominant 7",   alt:[] },
  { symbol:"Bb7",    type:"Dominant 7",   alt:[] },
  { symbol:"F7",     type:"Dominant 7",   alt:[] },
  { symbol:"D7",     type:"Dominant 7",   alt:[] },
  { symbol:"Cm7",    type:"Minor 7",      alt:["Cmin7","C-7"] },
  { symbol:"Cmin7",  type:"Minor 7",      alt:["Cm7","C-7"] },
  { symbol:"C-7",    type:"Minor 7",      alt:["Cm7","Cmin7"] },
  { symbol:"Dm7",    type:"Minor 7",      alt:["Dmin7","D-7"] },
  { symbol:"E-7",    type:"Minor 7",      alt:["Em7","Emin7"] },
  { symbol:"Am7",    type:"Minor 7",      alt:["A-7","Amin7"] },
  { symbol:"Cm7♭5",  type:"Minor 7♭5",   alt:["Cø7","Cø","C-7♭5"] },
  { symbol:"Cø7",    type:"Minor 7♭5",   alt:["Cm7♭5","Cø","C-7♭5"] },
  { symbol:"Cø",     type:"Minor 7♭5",   alt:["Cm7♭5","Cø7","C-7♭5"] },
  { symbol:"C-7♭5",  type:"Minor 7♭5",   alt:["Cm7♭5","Cø7","Cø"] },
  { symbol:"Bø7",    type:"Minor 7♭5",   alt:["Bm7♭5","B-7♭5"] },
  { symbol:"F#m7♭5", type:"Minor 7♭5",   alt:["F#ø7","F#ø"] },
  { symbol:"Cdim7",  type:"Diminished 7", alt:["C°7","C°"] },
  { symbol:"C°7",    type:"Diminished 7", alt:["Cdim7","C°"] },
  { symbol:"C°",     type:"Diminished 7", alt:["Cdim7","C°7"] },
  { symbol:"Gdim7",  type:"Diminished 7", alt:["G°7","G°"] },
  { symbol:"Bdim7",  type:"Diminished 7", alt:["B°7","B°"] },
];

const CHORD_TYPES = ["Major 7","Dominant 7","Minor 7","Minor 7♭5","Diminished 7"];

// Notes: staffPosition scale — pos 1=bottom line, pos 2=first space, pos 3=second line, etc.
// Each step = one diatonic step on the staff (lines and spaces alternate)
// pos 0 = first ledger line below; pos -1 = space below that; pos 10 = space above top line; pos 11 = first ledger line above
//
// Treble clef: bottom line (pos1)=E4, pos2=F4, pos3=G4, pos4=A4, pos5=B4,
//              pos6=C5, pos7=D5, pos8=E5(top line), pos9=F5, pos10=G5(ledger above)
//              pos0=D4(ledger below space), pos-1=C4(middle C ledger line)
//
// Bass clef:   bottom line (pos1)=G2, pos2=A2, pos3=B2, pos4=C3, pos5=D3,
//              pos6=E3, pos7=F3, pos8=G3(top line... wait bass has 5 lines)
//              Lines: pos1=G2, pos3=B2, pos5=D3, pos7=F3, pos9=A3 (top line)
//              Spaces: pos2=A2, pos4=C3, pos6=E3, pos8=G3
//              pos0=F2(space below bottom line), pos-1=E2(ledger below)
//              pos10=B3(space above top), pos11=C4(ledger above)

const NOTE_DATA = [
  // Treble clef naturals
  // pos -1 = middle C (C4) on ledger line below staff
  { clef:"treble", note:"C", octave:4, pos:-1, acc:null },
  { clef:"treble", note:"D", octave:4, pos:0,  acc:null },
  { clef:"treble", note:"E", octave:4, pos:1,  acc:null },
  { clef:"treble", note:"F", octave:4, pos:2,  acc:null },
  { clef:"treble", note:"G", octave:4, pos:3,  acc:null },
  { clef:"treble", note:"A", octave:4, pos:4,  acc:null },
  { clef:"treble", note:"B", octave:4, pos:5,  acc:null },
  { clef:"treble", note:"C", octave:5, pos:6,  acc:null },
  { clef:"treble", note:"D", octave:5, pos:7,  acc:null },
  { clef:"treble", note:"E", octave:5, pos:8,  acc:null },
  { clef:"treble", note:"F", octave:5, pos:9,  acc:null },
  { clef:"treble", note:"G", octave:5, pos:10, acc:null },
  // Treble sharps/flats
  { clef:"treble", note:"F", octave:4, pos:2,  acc:"sharp" },
  { clef:"treble", note:"C", octave:5, pos:6,  acc:"sharp" },
  { clef:"treble", note:"G", octave:4, pos:3,  acc:"sharp" },
  { clef:"treble", note:"B", octave:4, pos:5,  acc:"flat" },
  { clef:"treble", note:"E", octave:4, pos:1,  acc:"flat" },
  { clef:"treble", note:"A", octave:4, pos:4,  acc:"flat" },
  { clef:"treble", note:"D", octave:5, pos:7,  acc:"flat" },
  // Bass clef naturals
  // Bottom line=G2(pos1), lines: G2,B2,D3,F3,A3; spaces: A2,C3,E3,G3
  { clef:"bass", note:"E", octave:2, pos:-1, acc:null },
  { clef:"bass", note:"F", octave:2, pos:0,  acc:null },
  { clef:"bass", note:"G", octave:2, pos:1,  acc:null },
  { clef:"bass", note:"A", octave:2, pos:2,  acc:null },
  { clef:"bass", note:"B", octave:2, pos:3,  acc:null },
  { clef:"bass", note:"C", octave:3, pos:4,  acc:null },
  { clef:"bass", note:"D", octave:3, pos:5,  acc:null },
  { clef:"bass", note:"E", octave:3, pos:6,  acc:null },
  { clef:"bass", note:"F", octave:3, pos:7,  acc:null },
  { clef:"bass", note:"G", octave:3, pos:8,  acc:null },
  { clef:"bass", note:"A", octave:3, pos:9,  acc:null },
  { clef:"bass", note:"B", octave:3, pos:10, acc:null },
  // Bass sharps/flats
  { clef:"bass", note:"B", octave:2, pos:3,  acc:"flat" },
  { clef:"bass", note:"E", octave:3, pos:6,  acc:"flat" },
  { clef:"bass", note:"F", octave:3, pos:7,  acc:"sharp" },
  { clef:"bass", note:"C", octave:3, pos:4,  acc:"sharp" },
  { clef:"bass", note:"G", octave:2, pos:1,  acc:"sharp" },
  { clef:"bass", note:"A", octave:3, pos:9,  acc:"flat" },
];

// Key signatures: each entry covers both major and relative minor (they share the same signature)
const KEY_DATA = [
  { name:"C major or A minor",  accepted:["c major","a minor"],                     sharps:0, flats:0 },
  { name:"G major or E minor",  accepted:["g major","e minor"],                     sharps:1, flats:0 },
  { name:"D major or B minor",  accepted:["d major","b minor"],                     sharps:2, flats:0 },
  { name:"A major or F♯ minor", accepted:["a major","f♯ minor","f# minor"],    sharps:3, flats:0 },
  { name:"E major or C♯ minor", accepted:["e major","c♯ minor","c# minor"],    sharps:4, flats:0 },
  { name:"B major or G♯ minor", accepted:["b major","g♯ minor","g# minor"],    sharps:5, flats:0 },
  { name:"F major or D minor",  accepted:["f major","d minor"],                     sharps:0, flats:1 },
  { name:"B♭ major or G minor", accepted:["b♭ major","bb major","g minor"],    sharps:0, flats:2 },
  { name:"E♭ major or C minor", accepted:["e♭ major","eb major","c minor"],    sharps:0, flats:3 },
  { name:"A♭ major or F minor", accepted:["a♭ major","ab major","f minor"],    sharps:0, flats:4 },
];

// ─── STATE ───────────────────────────────────────────────────────────────────

let mode = 'chords';
let score = 0, total = 0, streak = 0;
let current = null;
let answered = false;
let pool = [];

// ─── UTILS ───────────────────────────────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function replenish() {
  const src = mode==='chords' ? CHORD_DATA : mode==='notes' ? NOTE_DATA : KEY_DATA;
  pool = shuffle([...src]);
}

function updateScore() {
  document.getElementById('score-val').textContent = score+' / '+total;
  document.getElementById('streak-val').textContent = streak;
}

// ─── MODE ────────────────────────────────────────────────────────────────────

function setMode(m) {
  mode = m;
  score=0; total=0; streak=0;
  updateScore();
  pool=[];
  document.querySelectorAll('.mode-btn').forEach((b,i)=>{
    b.classList.toggle('active', ['chords','notes','keys'][i]===m);
  });
  const labels = { chords:'Chord Symbols', notes:'Note Reading', keys:'Key Signatures' };
  document.getElementById('mode-label').textContent = labels[m];
  nextQuestion();
}

// ─── STAFF DRAWING ───────────────────────────────────────────────────────────

function drawStaff(clef, notePos, accidental, keySharps, keyFlats) {
  const W = 320, H = 160;
  const leftMargin = 80;
  const staffTop = 40;
  const lineGap = 12;
  const noteX = leftMargin + 120;

  // staffPos: 0=ledger below bottom line; each step up = lineGap/2
  // bottom line = pos 1, so y of pos p = staffTop + (9-p)*(lineGap/2) + 2*lineGap
  // lines at pos 1,3,5,7,9
  function posY(p) {
    return staffTop + 4*lineGap - (p-1)*(lineGap/2);
  }

  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

  // Staff lines
  const strokeColor = '#2C2C2A';
  for (let i=0; i<5; i++) {
    const y = staffTop + i*lineGap;
    svg += `<line x1="${leftMargin-10}" y1="${y}" x2="${W-20}" y2="${y}" stroke="${strokeColor}" stroke-width="1"/>`;
  }

  // Barline left
  svg += `<line x1="${leftMargin-10}" y1="${staffTop}" x2="${leftMargin-10}" y2="${staffTop+4*lineGap}" stroke="${strokeColor}" stroke-width="1.5"/>`;

  // Clef
  if (clef==='treble') {
    // Treble clef as text glyph
    svg += `<text x="${leftMargin-4}" y="${staffTop+4*lineGap+6}" font-size="72" font-family="serif" fill="${strokeColor}" style="font-style:normal">𝄞</text>`;
  } else {
    // Bass clef
    svg += `<text x="${leftMargin-4}" y="${staffTop+2*lineGap+4}" font-size="42" font-family="serif" fill="${strokeColor}">𝄢</text>`;
  }

  // Key signature accidentals
  // Treble: sharps go F5,C5,G5,D5,A4,E5,B4 = pos 9,6,10,7,4,8,5
  // Treble: flats go  B4,E5,A4,D5,G4,C5,F4 = pos 5,8,4,7,3,6,2
  // Bass:   sharps go F3,C3,G3,D3,A3,E3,B2 = pos 7,4,8,5,9,6,3
  // Bass:   flats go  B2,E3,A2,D3,G2,C3,F2 = pos 3,6,2,5,1,4,0
  const sharpPosTreble = [9, 6,10, 7, 4, 8, 5];
  const sharpPosBass   = [7, 4, 8, 5, 9, 6, 3];
  const flatPosTreble  = [5, 8, 4, 7, 3, 6, 2];
  const flatPosBass    = [3, 6, 2, 5, 1, 4, 0];

  const accX0 = leftMargin + 14;
  const accStep = 10;

  if (keySharps > 0) {
    const positions = clef==='treble' ? sharpPosTreble : sharpPosBass;
    for (let i=0; i<keySharps; i++) {
      const ay = posY(positions[i]);
      svg += `<text x="${accX0+i*accStep}" y="${ay+4}" font-size="14" font-family="serif" fill="${strokeColor}">♯</text>`;
    }
  } else if (keyFlats > 0) {
    const positions = clef==='treble' ? flatPosTreble : flatPosBass;
    for (let i=0; i<keyFlats; i++) {
      const ay = posY(positions[i]);
      svg += `<text x="${accX0+i*accStep}" y="${ay+5}" font-size="14" font-family="serif" fill="${strokeColor}">♭</text>`;
    }
  }

  // Note
  if (notePos !== undefined) {
    const ny = posY(notePos);
    const noteColor = '#1A1814';

    // Ledger lines
    // Staff lines are at odd positions: 1,3,5,7,9
    // Below staff: pos 0 = space below bottom line, pos -1 = first ledger line below
    // So ledger lines below are at odd positions: -1, -3, ...
    if (notePos <= 0) {
      for (let lp = -1; lp >= notePos; lp -= 2) {
        const ly = posY(lp);
        svg += `<line x1="${noteX-14}" y1="${ly}" x2="${noteX+14}" y2="${ly}" stroke="${strokeColor}" stroke-width="1"/>`;
      }
      // If note is in the space below bottom line (pos 0), still draw the bottom ledger reference? No - pos 0 is just a space, no ledger needed unless note is at pos -1 or below
    }
    // Above staff: top line = pos 9, space above = pos 10, first ledger above = pos 11
    // Ledger lines above are at odd positions: 11, 13, ...
    if (notePos >= 10) {
      for (let lp = 11; lp <= notePos; lp += 2) {
        const ly = posY(lp);
        svg += `<line x1="${noteX-14}" y1="${ly}" x2="${noteX+14}" y2="${ly}" stroke="${strokeColor}" stroke-width="1"/>`;
      }
    }

    // Accidental before note
    if (accidental === 'sharp') {
      svg += `<text x="${noteX-20}" y="${ny+5}" font-size="16" font-family="serif" fill="${noteColor}">♯</text>`;
    } else if (accidental === 'flat') {
      svg += `<text x="${noteX-18}" y="${ny+5}" font-size="16" font-family="serif" fill="${noteColor}">♭</text>`;
    }

    // Note head (filled ellipse)
    svg += `<ellipse cx="${noteX}" cy="${ny}" rx="7" ry="5.5" fill="${noteColor}" transform="rotate(-15,${noteX},${ny})"/>`;

    // Stem - stem up if note is below middle of staff (pos 5), down if above
    if (notePos < 5) {
      // stem up
      svg += `<line x1="${noteX+6}" y1="${ny}" x2="${noteX+6}" y2="${ny-36}" stroke="${noteColor}" stroke-width="1.5"/>`;
    } else {
      // stem down
      svg += `<line x1="${noteX-6}" y1="${ny}" x2="${noteX-6}" y2="${ny+36}" stroke="${noteColor}" stroke-width="1.5"/>`;
    }
  }

  svg += `</svg>`;
  return svg;
}

// ─── QUESTION LOGIC ──────────────────────────────────────────────────────────

function nextQuestion() {
  if (pool.length===0) replenish();
  current = pool.pop();
  answered = false;

  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='';
  document.getElementById('sub-feedback').textContent='';
  document.getElementById('next-btn').disabled=true;
  document.getElementById('answer-input').value='';
  document.getElementById('answer-input').disabled=false;
  document.getElementById('submit-btn').disabled=false;

  if (mode==='chords') {
    showChordQuestion();
  } else if (mode==='notes') {
    showNoteQuestion();
  } else {
    showKeyQuestion();
  }
}

function showChordQuestion() {
  document.getElementById('display-area').innerHTML =
    '<div id="chord-symbol" style="font-family:Lora,serif;font-size:58px;font-weight:400;color:var(--text);letter-spacing:-1px;text-align:center;display:flex;align-items:center;justify-content:center;">'
    + current.symbol + '</div>';
  document.getElementById('clef-label').textContent='';
  document.getElementById('answer-row').style.display='none';
  document.getElementById('note-helpers').style.display='none';

  const wrong = shuffle(CHORD_TYPES.filter(t=>t!==current.type)).slice(0,3);
  const opts = shuffle([current.type,...wrong]);

  const cont = document.getElementById('options');
  cont.innerHTML='';
  opts.forEach(type=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.textContent=type;
    btn.onclick=()=>handleChordAnswer(btn,type);
    cont.appendChild(btn);
  });
  cont.style.display='grid';
}

function showNoteQuestion() {
  document.getElementById('options').style.display='none';
  document.getElementById('options').innerHTML='';
  document.getElementById('clef-label').textContent = current.clef==='treble' ? 'Treble clef' : 'Bass clef';
  document.getElementById('answer-row').style.display='flex';
  document.getElementById('note-helpers').style.display='flex';
  document.getElementById('display-area').innerHTML = drawStaff(current.clef, current.pos, current.acc, 0, 0);
  document.getElementById('answer-input').placeholder = 'e.g. F♯ or B♭';
  document.getElementById('answer-input').focus();
}

function showKeyQuestion() {
  document.getElementById('options').style.display='none';
  document.getElementById('options').innerHTML='';
  document.getElementById('clef-label').textContent='Name this key signature';
  document.getElementById('answer-row').style.display='flex';
  document.getElementById('note-helpers').style.display='flex';
  document.getElementById('display-area').innerHTML = drawStaff('treble', undefined, null, current.sharps, current.flats);
  document.getElementById('answer-input').placeholder='e.g. G major or D minor';
  document.getElementById('answer-input').focus();
}

// ─── ANSWER HANDLING ─────────────────────────────────────────────────────────

function handleChordAnswer(btn, chosen) {
  if (answered) return;
  answered=true; total++;

  const correct = chosen===current.type;
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    if (b.textContent===current.type && b!==btn) b.classList.add('reveal');
  });

  if (correct) {
    btn.classList.add('correct');
    score++; streak++;
    setFeedback('correct', '✓ Correct!');
    if (current.alt && current.alt.length)
      document.getElementById('sub-feedback').textContent='Also written: '+current.alt.join(', ');
  } else {
    btn.classList.add('wrong');
    streak=0;
    setFeedback('wrong','✗ That\'s '+current.type+'.');
    if (current.alt && current.alt.length)
      document.getElementById('sub-feedback').textContent='Also written: '+current.alt.join(', ');
  }
  updateScore();
  document.getElementById('next-btn').disabled=false;
}

function normaliseNote(s) {
  return s.trim()
    .replace(/b(?=[^a-zA-Z]|$)/g,'♭')
    .replace(/#/g,'♯')
    .toLowerCase();
}

function submitFreeAnswer() {
  if (answered) return;
  const raw = document.getElementById('answer-input').value;
  if (!raw.trim()) return;
  answered=true; total++;
  document.getElementById('answer-input').disabled=true;
  document.getElementById('submit-btn').disabled=true;

  let correct=false;
  let correctAnswer='';

  if (mode==='notes') {
    const accStr = current.acc==='sharp' ? '♯' : current.acc==='flat' ? '♭' : '';
    correctAnswer = current.note + accStr;
    // Normalise input: uppercase, convert unicode accidentals and # to a canonical form
    // Crucially do NOT convert lone 'b' to flat here - we handle accidentals explicitly
    function normNote(s) {
      return s.trim()
        .replace(/♯/g,'#')   // ♯ -> #
        .replace(/♭/g,'b')   // ♭ -> b
        .toUpperCase();
    }
    const inp = normNote(raw);
    const noteUC = current.note.toUpperCase();
    const accUC = current.acc==='sharp' ? '#' : current.acc==='flat' ? 'B' : '';
    // Accept "B", "B#", "Bb" etc - note letter followed by accidental (or nothing)
    correct = inp === noteUC + accUC;
  } else {
    correctAnswer = current.name;
    const normInput = normaliseNote(raw.trim());
    // Accept any of the listed answers for this key signature (major or relative minor)
    correct = current.accepted.some(a => normaliseNote(a) === normInput);
  }

  if (correct) {
    score++; streak++;
    setFeedback('correct','✓ Correct! — '+correctAnswer);
  } else {
    streak=0;
    setFeedback('wrong','✗ Answer: '+correctAnswer);
  }
  updateScore();
  document.getElementById('next-btn').disabled=false;
}

function setFeedback(type, msg) {
  const el=document.getElementById('feedback');
  el.textContent=msg;
  el.className = type==='correct' ? 'correct-fb' : 'wrong-fb';
}

function insertChar(ch) {
  const inp=document.getElementById('answer-input');
  const start=inp.selectionStart, end=inp.selectionEnd;
  inp.value=inp.value.slice(0,start)+ch+inp.value.slice(end);
  inp.selectionStart=inp.selectionEnd=start+1;
  inp.focus();
}

// Enter key submits
document.getElementById('answer-input').addEventListener('keydown',e=>{
  if(e.key==='Enter') submitFreeAnswer();
});

// ─── INIT ────────────────────────────────────────────────────────────────────
replenish();
nextQuestion();
</script>
